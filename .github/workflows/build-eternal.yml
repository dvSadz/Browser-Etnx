name: Eternal Browser - Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - eternal
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'args.gn'
      - 'patches/**'
      - '**'

permissions:
  contents: write
  actions: read

env:
  DEPOT_TOOLS_UPDATE: "0"
  GYP_CHROMIUM_NO_ACTION: "1"

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          chmod +x .github/scripts/setup-deps.sh
          .github/scripts/setup-deps.sh

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-v1

  build:
    name: Build Android APK
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: eternal-ccache-${{ runner.os }}-${{ hashFiles('args.gn') }}
          restore-keys: |
            eternal-ccache-${{ runner.os }}-

      - name: Cache Chromium output
        uses: actions/cache@v4
        with:
          path: out/android_arm
          key: eternal-out-${{ runner.os }}-${{ hashFiles('args.gn') }}-${{ github.sha }}
          restore-keys: |
            eternal-out-${{ runner.os }}-${{ hashFiles('args.gn') }}-

      - name: Check disk space
        run: |
          df -h
          free -h

      - name: Validate build files
        run: |
          test -f args.gn || {
            echo "::error::args.gn não encontrado."
            exit 1
          }

          test -f .github/scripts/build-apk.sh || {
            echo "::error::build-apk.sh não encontrado."
            exit 1
          }

      - name: Build APK
        run: |
          chmod +x .github/scripts/build-apk.sh
          .github/scripts/build-apk.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eternal-Browser-APK
          path: |
            out/android_arm/apks/*.apk
            out/android_arm/apks/**/*.apk
            out/android_arm/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Draft Release
    needs: build
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Eternal-Browser-APK
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eternal-build-${{ github.run_number }}
          name: Eternal Browser Build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: release-assets/**/*.apk
          body: |
            Eternal Browser - Android build experimental.
            Teste instalação, estabilidade e extensões antes de distribuir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
